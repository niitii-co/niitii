{% extends "base.html" %}
{% import "macros/auth_macros.html" as macros %}

{% block content %}
    <div class="row justify-content-center align-items-center mt-2">
    <div class="col-sm-12 col-md-10 col-lg-10 col-xl-8 col-xxl-8">
        <h3>{{ _('Register') }}</h3>
            {{ macros.register(start_time) }}
        <span id="validate" hidden>{{ _('Passwords must match') }}</span>
    </div>
    </div>

    <script type="text/javascript">
        document.addEventListener('submit', (e) => {
            let form = e.target;
            if (form.password.value !== form.password2.value) {
                e.preventDefault();
                form.password2.setCustomValidity(`${document.getElementById('validate').textContent}`);
            }
        });
    </script>
{% endblock %}
